# ci.yml's e2e job deliberately never sets VLA_FULL, so hero-full.spec.ts —
# the only spec that waits for training to actually converge and checks
# command-decoding accuracy — never runs on a normal push or PR (review
# round 1, finding #4). bump-mini-vla.yml now runs it on every mini-vla
# version bump, but a regression introduced in this repo's own code (e.g.
# components/Hero.tsx) between bumps would still ship undetected. Run it
# nightly against main instead, so any regression surfaces within a day
# rather than never.
#
# On failure, open/update a single tracking issue (title-matched, so this
# never needs a pre-existing label) instead of relying solely on GitHub's
# default scheduled-workflow-failure email — that email goes only to
# whoever last edited this file, easy to miss or mute (review round 2,
# finding #13). The issue auto-closes on the next green run.
name: nightly-e2e-full

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Scheduled and workflow_dispatch runs can otherwise overlap (a manual run
# kicked off while the scheduled run is still mid-flight): without this, two
# in-flight "Open/update failure-tracking issue" steps can both see no
# existing issue and each create one, producing duplicate tracking issues.
concurrency:
  group: nightly-e2e-full
  cancel-in-progress: false

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
      # Single source of truth for both github-script steps below — they
      # match issues by exact title, so if the two ever held independent
      # literals and one drifted (a typo fix, a wording tweak), the close
      # step would stop finding what the open step created and the tracking
      # issue would never auto-close.
      TRACKING_ISSUE_TITLE: "nightly-e2e-full is failing"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build worker (next build + OpenNext bundle)
        run: npm run e2e:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # --project=desktop: hero-full.spec.ts's 35-min per-test timeout was
      # measured only against desktop/Chromium+SwiftShader (see its own
      # comment). It also matches the mobile/webkit-mobile projects, whose
      # convergence rate against that budget has never been measured — the
      # other hero specs already run on all three projects via ci.yml's own
      # e2e job on every push, so this doesn't lose coverage, only avoids an
      # unverified-timeout flake risk (review round 2, finding #14).
      - name: E2E including train-to-convergence (Playwright vs wrangler dev)
        run: npm run e2e:full -- --project=desktop

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Open/update failure-tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.TRACKING_ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // paginate, not a single listForRepo call: the API defaults to
            // 30 issues per page, so a repo that accumulates more than 30
            // open issues (of any kind) would silently push this tracking
            // issue off page 1 once enough newer issues exist above it.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The nightly train-to-convergence e2e run failed: ${runUrl}\n\nAuto-managed by .github/workflows/nightly-e2e-full.yml — closes automatically once this workflow passes again.`,
              });
            }

      - name: Close failure-tracking issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.TRACKING_ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            for (const issue of issues.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Passed: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
